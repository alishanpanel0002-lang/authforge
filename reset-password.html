<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — AuthForge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="logo"><span class="logo-mark">⬡</span><span class="logo-text">AuthForge</span></a>
      <button class="theme-toggle" id="themeToggle"><span class="theme-icon">◐</span></button>
    </div>
  </nav>

  <div class="auth-card" id="resetCard">
    <div class="auth-card-header">
      <div style="font-size:2.5rem;margin-bottom:8px">🔒</div>
      <h1>Reset password</h1>
      <p>We'll send a reset link to your email address.</p>
    </div>
    <form id="resetForm" novalidate>
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>
      <button type="submit" class="btn-primary btn-full" id="resetBtn">Send Reset Link</button>
    </form>
    <div class="auth-footer" style="margin-top:16px">
      <a href="login.html">← Back to sign in</a>
    </div>
  </div>

  <div class="auth-card hidden" id="successCard" style="text-align:center">
    <div style="font-size:3rem;margin-bottom:12px">📧</div>
    <h2 style="margin-bottom:8px">Check your inbox</h2>
    <p style="color:var(--text-2);margin-bottom:20px">If an account exists for <strong id="sentEmail"></strong>, we've sent a password reset link.</p>
    <a href="login.html" class="btn-primary btn-full">Return to Sign In</a>
  </div>

  <div id="toast-container"></div>
  <script src="js/utils.js"></script>
  <script type="module">
    import { resetPassword, getAuthErrorMessage } from './js/auth.js';

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const btn = document.getElementById('resetBtn');

      if (!validateEmail(email)) {
        setFieldError(document.getElementById('email'), 'Enter a valid email address');
        return;
      }

      setLoading(btn, true, 'Sending...');
      try {
        await resetPassword(email);
        document.getElementById('resetCard').classList.add('hidden');
        document.getElementById('successCard').classList.remove('hidden');
        document.getElementById('sentEmail').textContent = email;
      } catch (err) {
        // Don't reveal if email exists for security
        document.getElementById('resetCard').classList.add('hidden');
        document.getElementById('successCard').classList.remove('hidden');
        document.getElementById('sentEmail').textContent = email;
      }
    });
  </script>
</body>
</html>
