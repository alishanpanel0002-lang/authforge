<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — AuthForge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-page">

  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark">⬡</span>
        <span class="logo-text">AuthForge</span>
      </a>
      <div class="nav-links">
        <a href="signup.html" class="btn-primary">Create account →</a>
      </div>
      <button class="theme-toggle" id="themeToggle">
        <span class="theme-icon">◐</span>
      </button>
    </div>
  </nav>

  <div class="auth-card">
    <div class="auth-card-header">
      <div class="logo" style="justify-content:center;margin-bottom:12px">
        <span class="logo-mark">⬡</span>
        <span class="logo-text">AuthForge</span>
      </div>
      <h1>Welcome back</h1>
      <p>Sign in to your developer account</p>
    </div>

    <!-- Google OAuth -->
    <button class="btn-google" id="googleSignIn">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>

    <div class="auth-divider">or continue with email</div>

    <!-- Email/Password Form -->
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password" autocomplete="current-password" required />
      </div>
      <div class="form-row">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" id="rememberMe" /> Remember me
        </label>
        <a href="reset-password.html">Forgot password?</a>
      </div>
      <button type="submit" class="btn-primary btn-full" id="loginBtn">Sign In</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="signup.html">Create one free →</a>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="/js/utils.js"></script>
  <script type="module">
    import {
      signIn,
      signInWithGoogle,
      redirectIfLoggedIn,
      getAuthErrorMessage
    } from '/js/auth.js';

    redirectIfLoggedIn('/dashboard.html');

    // Google sign in
    document.getElementById('googleSignIn').addEventListener('click', async () => {
      const btn = document.getElementById('googleSignIn');
      setLoading(btn, true, 'Signing in...');
      try {
        await signInWithGoogle();
        showToast('Signed in with Google!', 'success');
        window.location.href = '/dashboard.html';
      } catch (err) {
        showToast(getAuthErrorMessage(err.code), 'error');
        setLoading(btn, false, `
          <svg class="google-icon" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continue with Google`);
      }
    });

    // Email/password form
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');

      // Validate
      let valid = true;
      if (!validateEmail(email)) { setFieldError(document.getElementById('email'), 'Enter a valid email address'); valid = false; }
      else clearFieldError(document.getElementById('email'));
      if (!password) { setFieldError(document.getElementById('password'), 'Password is required'); valid = false; }
      else clearFieldError(document.getElementById('password'));
      if (!valid) return;

      setLoading(btn, true, 'Signing in...');
      try {
        await signIn(email, password);
        showToast('Welcome back!', 'success');
        window.location.href = '/dashboard.html';
      } catch (err) {
        showToast(getAuthErrorMessage(err.code), 'error');
        setLoading(btn, false, 'Sign In');
      }
    });

    // Clear errors on input
    ['email', 'password'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        clearFieldError(document.getElementById(id));
      });
    });
  </script>
</body>
</html>
